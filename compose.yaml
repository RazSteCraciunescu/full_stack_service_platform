services:
  app:
    build: .
    ports:
      - "4174:4174"
    environment:
      HOST: 0.0.0.0
      PORT: 4174
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4174/api/health').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 5

  mysql:
    image: mysql:8.4
    profiles: ["database"]
    environment:
      MYSQL_DATABASE: service_portal
      MYSQL_USER: ${MYSQL_USER:-service_portal}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-service_portal}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-local-root-password}
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./database/mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-local-root-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
