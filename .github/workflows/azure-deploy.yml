name: Deploy Azure demo

on:
  workflow_dispatch:
    inputs:
      resource_group:
        description: Existing or new Azure resource group
        required: true
        default: service-portal-demo
      location:
        description: Azure region
        required: true
        default: westeurope
      sku:
        description: App Service plan SKU
        required: true
        type: choice
        options: [F1, B1]
        default: F1

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: azure-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install and verify
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm test

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Create resource group
        run: az group create --name "${{ inputs.resource_group }}" --location "${{ inputs.location }}"

      - name: Deploy infrastructure
        id: infrastructure
        shell: bash
        run: |
          deployment=$(az deployment group create \
            --resource-group "${{ inputs.resource_group }}" \
            --template-file infra/azure/main.bicep \
            --parameters workloadName=service-portal appServiceSku="${{ inputs.sku }}" \
            --output json)
          app_name=$(echo "$deployment" | jq -r '.properties.outputs.webAppName.value')
          echo "app_name=$app_name" >> "$GITHUB_OUTPUT"

      - name: Package application
        run: zip -r service-portal.zip dist public data api package.json

      - name: Deploy application package
        run: |
          az webapp deploy \
            --resource-group "${{ inputs.resource_group }}" \
            --name "${{ steps.infrastructure.outputs.app_name }}" \
            --src-path service-portal.zip \
            --type zip
